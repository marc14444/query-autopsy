name: Release Extension (VS Code Marketplace & Open VSX)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - run: npm run test
      - run: npm run package:vsix

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "${VSCE_PAT:-}" ]; then
            npx --no-install vsce publish --packagePath *.vsix --no-dependencies --skip-duplicate
          else
            echo "VSCE_PAT secret is not configured; skipping Visual Studio Marketplace publish."
          fi

      - name: Publish to Open VSX Registry (Antigravity, Cursor, Windsurf, VSCodium)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "${OVSX_PAT:-}" ]; then
            npx --yes ovsx publish *.vsix -p "$OVSX_PAT"
          else
            echo "OVSX_PAT secret is not configured; skipping Open VSX publish."
          fi
