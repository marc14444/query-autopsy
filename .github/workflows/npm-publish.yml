name: Publish npm Packages (@query-autopsy/core, executors, cli, mcp)

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - run: npm run test
      - run: npm run build:packages
      - name: Publish workspace packages sequentially with OIDC provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::error::NPM_TOKEN secret is not configured in repository Actions secrets."
              exit 1
            fi
            echo "::notice::NPM_TOKEN secret is not configured; skipping npm publish."
            exit 0
          fi

          for pkg_dir in packages/core packages/executors packages/cli packages/mcp; do
            PKG_NAME=$(node -p "require('./${pkg_dir}/package.json').name")
            PKG_VERSION=$(node -p "require('./${pkg_dir}/package.json').version")

            if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
              echo "${PKG_NAME}@${PKG_VERSION} is already published on npm — skipping."
            else
              echo "Publishing ${PKG_NAME}@${PKG_VERSION}..."
              npm publish --workspace="${PKG_NAME}" --access public --provenance
            fi
          done
