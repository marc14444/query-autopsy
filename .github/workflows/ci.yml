name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  branch-naming:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch naming convention
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          PATTERN='^(feat|fix|chore|docs|refactor|test|ci|perf|hotfix)\/[a-z0-9][a-z0-9._-]*$'
          BOT_PATTERN='^(dependabot|renovate)\/.+$'
          if [[ "$HEAD_REF" =~ $PATTERN || "$HEAD_REF" =~ $BOT_PATTERN ]]; then
            echo "Branch name '$HEAD_REF' matches repository convention."
          else
            echo "::error::Invalid PR branch name '$HEAD_REF'. Expected prefix: feat/, fix/, chore/, docs/, refactor/, test/, ci/, perf/, or hotfix/ (lowercase kebab-case, e.g. feat/v0.4.0-multi-engine)."
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - run: npm run test
      - name: Enforce Hexagonal Architecture boundaries
        run: |
          if grep -rnE "from ['\"](vscode|pg|mysql2|sql\.js|node:|.*infrastructure|.*presentation|.*application|.*executors)" packages/core/src/domain packages/core/src/application; then
            echo "::error::Forbidden layer import detected inside @query-autopsy/core domain/ or application/ (see AGENTS.md)."
            exit 1
          fi
      - run: npm run package

  php-laravel-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP sources & validate Composer manifest
        run: |
          find packages/laravel -name '*.php' -print0 | xargs -0 -n1 php -l
          composer validate --strict --working-dir=packages/laravel
      - name: Run native PHP Laravel bridge unit tests
        run: php packages/laravel/tests/run.php

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: queryautopsy
          POSTGRES_DB: query_autopsy_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: queryautopsy
          MYSQL_DATABASE: query_autopsy_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pqueryautopsy --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run live PostgreSQL & MySQL E2E tests
        env:
          QUERY_AUTOPSY_PG_TEST_URI: postgresql://postgres:queryautopsy@127.0.0.1:5432/query_autopsy_e2e
          QUERY_AUTOPSY_MYSQL_TEST_URI: mysql://root:queryautopsy@127.0.0.1:3306/query_autopsy_e2e
        run: npm run test:e2e
