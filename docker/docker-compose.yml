services:
  postgres:
    image: postgres:16-alpine
    container_name: query_autopsy_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: queryautopsy
      POSTGRES_DB: query_autopsy_dev
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    container_name: query_autopsy_mysql
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: queryautopsy
      MYSQL_DATABASE: query_autopsy_dev
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  pgdata:
  mysqldata:
